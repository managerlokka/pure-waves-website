<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Waves | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070b10;
            --bg-secondary: #0d1117;
            --accent-color: #00e0c0;
            --accent-hover: #33f5d8;
            --text-primary: #ffffff;
            --text-secondary: #8b9cb5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 224, 192, 0.2);
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
        }

        .btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background-color: #ff6b81;
        }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-item {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(0, 224, 192, 0.1);
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 20px;
            align-items: center;
        }

        .thumbnail-preview {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #000;
        }

        .video-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Outfit', sans-serif;
            width: 100%;
            box-sizing: border-box;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 15px 25px;
            border-radius: 4px;
            font-weight: 600;
            transform: translateX(200%);
            transition: transform 0.3s;
            z-index: 1000;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Thumbnail Picker Modal */
        .thumb-picker-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .thumb-picker-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .thumb-picker-modal {
            background: var(--bg-secondary);
            border: 1px solid rgba(0, 224, 192, 0.2);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .thumb-picker-overlay.active .thumb-picker-modal {
            transform: scale(1);
        }
        .thumb-picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .thumb-picker-header h2 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.3rem;
        }
        .thumb-picker-close {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .thumb-picker-close:hover {
            background: rgba(255,0,0,0.3);
            border-color: rgba(255,0,0,0.5);
        }
        .thumb-picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .thumb-picker-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            aspect-ratio: 16/9;
        }
        .thumb-picker-item:hover {
            border-color: var(--accent-color);
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 224, 192, 0.3);
        }
        .thumb-picker-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb-picker-item .thumb-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.75);
            color: white;
            font-size: 0.7rem;
            padding: 4px 6px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .browse-thumb-btn {
            background: rgba(0, 224, 192, 0.15);
            border: 1px solid rgba(0, 224, 192, 0.3);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            margin-left: 8px;
        }
        .browse-thumb-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div id="notification">Changes Saved!</div>

    <div class="admin-container">
        <div class="header">
            <h1>Video Portfolio Admin</h1>
            <div>
                <a href="/" target="_blank" style="color: var(--text-secondary); margin-right: 20px; text-decoration: none;">View Live Site</a>
                <button class="btn" onclick="saveVideos()">💾 Save All Videos</button>
            </div>
        </div>

        <div style="background-color: var(--bg-secondary); border: 1px solid rgba(0, 224, 192, 0.1); border-radius: 8px; padding: 20px; margin-bottom: 40px;">
            <h2 style="margin-top: 0; color: var(--accent-color); font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Social Links Settings</h2>
            <div class="video-details" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="form-group">
                    <label>WhatsApp Number (e.g. 94767012065)</label>
                    <input type="text" id="setting-whatsapp" placeholder="94767012065">
                </div>
                <div class="form-group">
                    <label>Facebook Page URL</label>
                    <input type="text" id="setting-facebook" placeholder="https://facebook.com/...">
                </div>
                <div class="form-group">
                    <label>YouTube Channel URL</label>
                    <input type="text" id="setting-youtube" placeholder="https://youtube.com/...">
                </div>
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <button class="btn" onclick="saveSettings()">⚙️ Save Links</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="addVideo()">+ Add New Video</button>
        </div>

        <div class="video-list" id="videoList">
            <!-- Videos rendered here -->
        </div>
    </div>

    <!-- Thumbnail Picker Modal -->
    <div class="thumb-picker-overlay" id="thumbPickerOverlay" onclick="if(event.target===this) closeThumbPicker()">
        <div class="thumb-picker-modal">
            <div class="thumb-picker-header">
                <h2>📸 Select a Thumbnail</h2>
                <button class="thumb-picker-close" onclick="closeThumbPicker()">✕ Close</button>
            </div>
            <div class="thumb-picker-grid" id="thumbPickerGrid">
                <!-- Thumbnails loaded here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://iuvbbitcssilphdghaab.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dmJiaXRjc3NpbHBoZGdoYWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjQ1MTUsImV4cCI6MjA5Mzc0MDUxNX0.irJZvYaVCgHR5XAPdBMO-JIAS0JlFBnXrMpEbmmh4xo';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let videos = [];

        // Load settings
        supabaseClient.from('settings').select('*').limit(1).single().then(({ data, error }) => {
            if (data) {
                document.getElementById('setting-whatsapp').value = data.whatsapp || '';
                document.getElementById('setting-facebook').value = data.facebook || '';
                document.getElementById('setting-youtube').value = data.youtube || '';
            }
        });

        async function saveSettings() {
            const settings = {
                id: 1,
                whatsapp: document.getElementById('setting-whatsapp').value,
                facebook: document.getElementById('setting-facebook').value,
                youtube: document.getElementById('setting-youtube').value
            };
            
            const { error } = await supabaseClient.from('settings').upsert(settings);
            
            if (!error) {
                const notif = document.getElementById('notification');
                notif.textContent = "Links Saved!";
                notif.style.transform = 'translateX(0)';
                setTimeout(() => {
                    notif.style.transform = 'translateX(200%)';
                    setTimeout(() => notif.textContent = "Changes Saved!", 300);
                }, 3000);
            } else {
                alert('Error saving settings: ' + error.message);
            }
        }

        // Load videos on start
        supabaseClient.from('videos').select('*').order('id', { ascending: true }).then(({ data, error }) => {
            if (error) {
                console.error("Error loading videos:", error);
                alert("Failed to load videos from Supabase.");
            } else {
                videos = data || [];
                renderVideos();
            }
        });

        function renderVideos() {
            const list = document.getElementById('videoList');
            list.innerHTML = '';

            if(videos.length === 0) {
                list.innerHTML = '<div class="empty-state">No videos found. Add one above!</div>';
                return;
            }

            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                
                item.innerHTML = `
                    <img src="${video.thumbnail || 'https://via.placeholder.com/100'}" class="thumbnail-preview" alt="Thumb">
                    <div class="video-details">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" value="${video.title || ''}" onchange="updateVideo(${index}, 'title', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Artist Name</label>
                            <input type="text" value="${video.artist || ''}" onchange="updateVideo(${index}, 'artist', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select onchange="updateVideo(${index}, 'category', this.value)">
                                <option value="music-video" ${video.category === 'music-video' ? 'selected' : ''}>Music Video</option>
                                <option value="lyric-video" ${video.category === 'lyric-video' ? 'selected' : ''}>Lyric Video</option>
                                <option value="bts" ${video.category === 'bts' ? 'selected' : ''}>Behind the Scenes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Optional Badge (e.g., '✨ AI Generated')</label>
                            <input type="text" value="${video.badge || ''}" onchange="updateVideo(${index}, 'badge', this.value)">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Google Drive Preview URL</label>
                            <input type="text" value="${video.video_url || ''}" onchange="updateVideo(${index}, 'video_url', this.value)" placeholder="https://drive.google.com/file/d/.../preview">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Thumbnail Image URL</label>
                            <div style="display: flex; align-items: center;">
                                <input type="text" id="thumb-input-${index}" value="${video.thumbnail || ''}" onchange="updateVideo(${index}, 'thumbnail', this.value); renderVideos();" style="flex: 1;">
                                <button class="browse-thumb-btn" onclick="openThumbPicker(${index})">📸 Browse</button>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-danger" onclick="deleteVideo(${index})">🗑️ Delete</button>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function updateVideo(index, field, value) {
            videos[index][field] = value;
            videos[index]._isModified = true;
        }

        function addVideo() {
            videos.unshift({
                title: "New Video",
                artist: "Artist Name",
                category: "music-video",
                thumbnail: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1000&auto=format&fit=crop",
                video_url: "https://drive.google.com/file/d/.../preview",
                badge: "",
                _isNew: true
            });
            renderVideos();
        }

        async function deleteVideo(index) {
            if(confirm("Are you sure you want to delete this video?")) {
                const video = videos[index];
                if (video.id) {
                    await supabaseClient.from('videos').delete().eq('id', video.id);
                }
                videos.splice(index, 1);
                renderVideos();
            }
        }

        async function saveVideos() {
            let hasError = false;
            
            // Because we don't know what was just added vs updated, we loop through
            for (const video of videos) {
                if (video._isNew || video._isModified) {
                    const payload = {
                        title: video.title,
                        artist: video.artist,
                        category: video.category,
                        thumbnail: video.thumbnail,
                        video_url: video.video_url || video.videoUrl,
                        badge: video.badge
                    };
                    
                    let error;
                    if (video.id) {
                        const res = await supabaseClient.from('videos').update(payload).eq('id', video.id);
                        error = res.error;
                    } else {
                        const res = await supabaseClient.from('videos').insert(payload);
                        error = res.error;
                    }
                    
                    if (error) {
                        hasError = true;
                        console.error(error);
                    } else {
                        video._isNew = false;
                        video._isModified = false;
                    }
                }
            }
            
            if (hasError) {
                alert('Error saving some videos. Check console.');
            } else {
                // Reload clean state
                const { data } = await supabaseClient.from('videos').select('*').order('id', { ascending: true });
                videos = data || [];
                renderVideos();
                
                const notif = document.getElementById('notification');
                notif.style.transform = 'translateX(0)';
                setTimeout(() => {
                    notif.style.transform = 'translateX(200%)';
                }, 3000);
            }
        }

        // ===== Thumbnail Picker =====
        let availableThumbs = [];
        let activePickerIndex = -1;

        // Load thumbnail list
        fetch('/thumbnails.json?t=' + new Date().getTime())
            .then(r => r.json())
            .then(data => { availableThumbs = data; })
            .catch(err => console.error("Could not load thumbnails.json:", err));

        function openThumbPicker(videoIndex) {
            activePickerIndex = videoIndex;
            const grid = document.getElementById('thumbPickerGrid');
            grid.innerHTML = '';

            if (availableThumbs.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-secondary); text-align: center; grid-column: 1/-1;">No thumbnails found. Add images to your project folder and update thumbnails.json.</p>';
            }

            availableThumbs.forEach(thumb => {
                const item = document.createElement('div');
                item.className = 'thumb-picker-item';
                item.innerHTML = `
                    <img src="${thumb}" alt="${thumb}" onerror="this.src='https://via.placeholder.com/200x112?text=Not+Found'">
                    <div class="thumb-name">${thumb}</div>
                `;
                item.addEventListener('click', () => selectThumb(thumb));
                grid.appendChild(item);
            });

            document.getElementById('thumbPickerOverlay').classList.add('active');
        }

        function closeThumbPicker() {
            document.getElementById('thumbPickerOverlay').classList.remove('active');
            activePickerIndex = -1;
        }

        function selectThumb(thumbName) {
            if (activePickerIndex >= 0) {
                updateVideo(activePickerIndex, 'thumbnail', thumbName);
                const input = document.getElementById('thumb-input-' + activePickerIndex);
                if (input) input.value = thumbName;
                renderVideos();
            }
            closeThumbPicker();
        }
    </script>
</body>
</html>
