<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Waves | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070b10;
            --bg-secondary: #0d1117;
            --accent-color: #00e0c0;
            --accent-hover: #33f5d8;
            --text-primary: #ffffff;
            --text-secondary: #8b9cb5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 224, 192, 0.2);
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
        }

        .btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background-color: #ff6b81;
        }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-item {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(0, 224, 192, 0.1);
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 20px;
            align-items: center;
        }

        .thumbnail-preview {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #000;
        }

        .video-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Outfit', sans-serif;
            width: 100%;
            box-sizing: border-box;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 15px 25px;
            border-radius: 4px;
            font-weight: 600;
            transform: translateX(200%);
            transition: transform 0.3s;
            z-index: 1000;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div id="notification">Changes Saved!</div>

    <div class="admin-container">
        <div class="header">
            <h1>Video Portfolio Admin</h1>
            <div>
                <a href="/" target="_blank" style="color: var(--text-secondary); margin-right: 20px; text-decoration: none;">View Live Site</a>
                <button class="btn" onclick="saveVideos()">💾 Save All Videos</button>
            </div>
        </div>

        <div style="background-color: var(--bg-secondary); border: 1px solid rgba(0, 224, 192, 0.1); border-radius: 8px; padding: 20px; margin-bottom: 40px;">
            <h2 style="margin-top: 0; color: var(--accent-color); font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Social Links Settings</h2>
            <div class="video-details" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="form-group">
                    <label>WhatsApp Number (e.g. 94767012065)</label>
                    <input type="text" id="setting-whatsapp" placeholder="94767012065">
                </div>
                <div class="form-group">
                    <label>Facebook Page URL</label>
                    <input type="text" id="setting-facebook" placeholder="https://facebook.com/...">
                </div>
                <div class="form-group">
                    <label>YouTube Channel URL</label>
                    <input type="text" id="setting-youtube" placeholder="https://youtube.com/...">
                </div>
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <button class="btn" onclick="saveSettings()">⚙️ Save Links</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="addVideo()">+ Add New Video</button>
        </div>

        <div class="video-list" id="videoList">
            <!-- Videos rendered here -->
        </div>
    </div>

    <script>
        let videos = [];

        // Load settings
        fetch('/settings.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                document.getElementById('setting-whatsapp').value = data.whatsapp || '';
                document.getElementById('setting-facebook').value = data.facebook || '';
                document.getElementById('setting-youtube').value = data.youtube || '';
            })
            .catch(err => console.error("Error loading settings:", err));

        function saveSettings() {
            const settings = {
                whatsapp: document.getElementById('setting-whatsapp').value,
                facebook: document.getElementById('setting-facebook').value,
                youtube: document.getElementById('setting-youtube').value
            };
            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    const notif = document.getElementById('notification');
                    notif.textContent = "Links Saved!";
                    notif.style.transform = 'translateX(0)';
                    setTimeout(() => {
                        notif.style.transform = 'translateX(200%)';
                        setTimeout(() => notif.textContent = "Changes Saved!", 300);
                    }, 3000);
                }
            })
            .catch(err => alert('Error saving settings!'));
        }

        // Load videos on start
        fetch('/data.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                videos = data;
                renderVideos();
            })
            .catch(err => {
                console.error("Error loading videos:", err);
                alert("Failed to load videos. Make sure server is running.");
            });

        function renderVideos() {
            const list = document.getElementById('videoList');
            list.innerHTML = '';

            if(videos.length === 0) {
                list.innerHTML = '<div class="empty-state">No videos found. Add one above!</div>';
                return;
            }

            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                
                item.innerHTML = `
                    <img src="${video.thumbnail || 'https://via.placeholder.com/100'}" class="thumbnail-preview" alt="Thumb">
                    <div class="video-details">
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" value="${video.title}" onchange="updateVideo(${index}, 'title', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Artist Name</label>
                            <input type="text" value="${video.artist}" onchange="updateVideo(${index}, 'artist', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select onchange="updateVideo(${index}, 'category', this.value)">
                                <option value="music-video" ${video.category === 'music-video' ? 'selected' : ''}>Music Video</option>
                                <option value="lyric-video" ${video.category === 'lyric-video' ? 'selected' : ''}>Lyric Video</option>
                                <option value="bts" ${video.category === 'bts' ? 'selected' : ''}>Behind the Scenes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Optional Badge (e.g., '✨ AI Generated')</label>
                            <input type="text" value="${video.badge || ''}" onchange="updateVideo(${index}, 'badge', this.value)">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Google Drive Preview URL</label>
                            <input type="text" value="${video.videoUrl}" onchange="updateVideo(${index}, 'videoUrl', this.value)" placeholder="https://drive.google.com/file/d/.../preview">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Thumbnail Image URL</label>
                            <input type="text" value="${video.thumbnail}" onchange="updateVideo(${index}, 'thumbnail', this.value); renderVideos();">
                        </div>
                        <div class="actions">
                            <button class="btn btn-danger" onclick="deleteVideo(${index})">🗑️ Delete</button>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function updateVideo(index, field, value) {
            videos[index][field] = value;
        }

        function addVideo() {
            videos.unshift({
                id: Date.now(),
                title: "New Video",
                artist: "Artist Name",
                category: "music-video",
                thumbnail: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1000&auto=format&fit=crop",
                videoUrl: "https://drive.google.com/file/d/.../preview",
                badge: ""
            });
            renderVideos();
        }

        function deleteVideo(index) {
            if(confirm("Are you sure you want to delete this video?")) {
                videos.splice(index, 1);
                renderVideos();
            }
        }

        function saveVideos() {
            fetch('/api/videos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(videos)
            })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    const notif = document.getElementById('notification');
                    notif.style.transform = 'translateX(0)';
                    setTimeout(() => {
                        notif.style.transform = 'translateX(200%)';
                    }, 3000);
                }
            })
            .catch(err => {
                alert('Error saving videos!');
                console.error(err);
            });
        }
    </script>
</body>
</html>
